---
- name: Render Hermes nginx reverse proxy config
  hosts: localhost
  gather_facts: false
  vars:
    hermes_nginx_fqdn: chris-hermes.example.ch
    hermes_nginx_tls_enabled: true
    hermes_nginx_tls_cert: /etc/pki/tls/hermes-chris/tls.crt
    hermes_nginx_tls_key: /etc/pki/tls/hermes-chris/tls.key
    hermes_nginx_client_max_body_size: 100m
    hermes_nginx_basic_auth_enabled: true
    hermes_nginx_basic_auth_realm: Hermes Chris
    hermes_nginx_basic_auth_file: /etc/nginx/.htpasswd-hermes-chris
    hermes_dashboard_port: 8081
    rendered_nginx_conf: /tmp/hermes-nginx-render.conf
  tasks:
    - name: Render nginx template
      ansible.builtin.template:
        src: ../templates/nginx-hermes.conf.j2
        dest: "{{ rendered_nginx_conf }}"
        mode: "0644"

    - name: Read rendered nginx config
      ansible.builtin.slurp:
        src: "{{ rendered_nginx_conf }}"
      register: rendered_nginx

    - name: Assert nginx config protects Hermes dashboard and proxies loopback
      ansible.builtin.assert:
        that:
          - "'server_name chris-hermes.example.ch;' in rendered_nginx_text"
          - "'auth_basic \"Hermes Chris\";' in rendered_nginx_text"
          - "'auth_basic_user_file /etc/nginx/.htpasswd-hermes-chris;' in rendered_nginx_text"
          - "'proxy_pass http://127.0.0.1:8081;' in rendered_nginx_text"
          - "'proxy_set_header Host 127.0.0.1:8081;' in rendered_nginx_text"
          - "'proxy_set_header Authorization \"\";' in rendered_nginx_text"
          - "'proxy_set_header Origin \"\";' in rendered_nginx_text"
          - "'proxy_set_header Upgrade $http_upgrade;' in rendered_nginx_text"
          - "'proxy_set_header Connection \"upgrade\";' in rendered_nginx_text"
          - "'map $http_upgrade' not in rendered_nginx_text"
      vars:
        rendered_nginx_text: "{{ rendered_nginx.content | b64decode }}"
...
