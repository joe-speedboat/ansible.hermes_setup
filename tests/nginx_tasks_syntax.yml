---
- name: Syntax check Hermes nginx task file
  hosts: localhost
  gather_facts: false
  vars:
    hermes_nginx_enabled: false
    hermes_nginx_fqdn: hermes.example.ch
    hermes_nginx_tls_enabled: true
    hermes_nginx_basic_auth_enabled: true
    hermes_nginx_basic_auth_users: []
    hermes_nginx_basic_auth_user: hermes
    hermes_nginx_basic_auth_password: not-the-default
    hermes_dashboard_host: 127.0.0.1
  tasks:
    - name: Import nginx tasks for syntax validation
      ansible.builtin.import_tasks: ../tasks/rhelAll-10/35_nginx.yml
...
