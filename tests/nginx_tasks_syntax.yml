---
- name: Syntax check Hermes nginx task file
  hosts: localhost
  gather_facts: false
  vars:
    hermes_nginx_enabled: false
    hermes_dashboard_nginx_fqdn: hermes.example.ch
    hermes_nginx_tls_enabled: true
    hermes_nginx_letsencrypt_enabled: false
    hermes_nginx_letsencrypt_email: hermes@webui-hermes.example.ch
    hermes_nginx_letsencrypt_staging: false
    hermes_nginx_letsencrypt_mode: combined
    hermes_nginx_letsencrypt_webroot: /var/lib/letsencrypt
    hermes_nginx_letsencrypt_cert_name: hermes.example.ch
    hermes_nginx_letsencrypt_fullchain_path: /etc/letsencrypt/live/hermes.example.ch/fullchain.pem
    hermes_nginx_letsencrypt_privkey_path: /etc/letsencrypt/live/hermes.example.ch/privkey.pem
    hermes_dashboard_nginx_basic_auth_enabled: true
    hermes_dashboard_nginx_basic_auth_user: hermes
    hermes_dashboard_nginx_basic_auth_password: not-the-default
    firewalld_open_ports:
      - 443/tcp
    hermes_dashboard_host: 127.0.0.1
    hermes_webui_enabled: false
    hermes_webui_host: 127.0.0.1
    hermes_webui_nginx_fqdn: webui-hermes.example.ch
    hermes_webui_nginx_tls_cert: /etc/pki/tls/hermes/webui-hermes.example.ch_tls.crt
    hermes_webui_nginx_tls_key: /etc/pki/tls/hermes/webui-hermes.example.ch_tls.key
    hermes_webui_nginx_basic_auth_user: hermes
    hermes_webui_nginx_basic_auth_password: not-the-default
    hermes_webui_nginx_basic_auth_file: /etc/nginx/.htpasswd-hermes-webui-hermes.example.ch
    hermes_webui_nginx_basic_auth_realm: webui-hermes.example.ch
  tasks:
    - name: Import nginx tasks for syntax validation
      ansible.builtin.import_tasks: ../tasks/rhelAll-10/35_nginx.yml
...
