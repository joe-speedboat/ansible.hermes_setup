---
- name: Validate Hermes nginx reverse proxy settings
  ansible.builtin.assert:
    that:
      - hermes_nginx_fqdn | length > 0
      - hermes_dashboard_host in ['127.0.0.1', 'localhost', '::1']
      - hermes_nginx_tls_enabled | bool
      - not (hermes_nginx_basic_auth_enabled | bool) or (hermes_nginx_basic_auth_user | length > 0)
      - not (hermes_nginx_basic_auth_enabled | bool) or (hermes_nginx_basic_auth_password | length > 0)
    fail_msg: >-
      hermes_nginx_enabled requires a non-empty hermes_nginx_fqdn, a loopback-only
      hermes_dashboard_host, TLS enabled, and a non-empty Basic Auth user/password when Basic Auth is enabled.
      Use one DNS vhost per Hermes Linux user and proxy to that user's loopback dashboard port.
  no_log: "{{ hermes_nginx_basic_auth_enabled | bool }}"
  when: hermes_nginx_enabled | bool

- name: Warn when Hermes nginx Basic Auth uses the default password
  ansible.builtin.debug:
    msg: >-
      WARNING: hermes_nginx_basic_auth_password is still set to the default value 'changeme'.
      Override it with Ansible Vault before exposing this endpoint outside a disposable lab.
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_basic_auth_enabled | bool
    - hermes_nginx_basic_auth_password == 'changeme'

- name: Install nginx for Hermes reverse proxy
  ansible.builtin.dnf:
    name:
      - nginx
      - openssl
      - policycoreutils-python-utils
    state: present
  when: hermes_nginx_enabled | bool

- name: Ensure Hermes nginx TLS directory exists
  ansible.builtin.file:
    path: "{{ hermes_nginx_tls_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_tls_enabled | bool

- name: Generate self-signed Hermes nginx TLS certificate
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -newkey
      - rsa:4096
      - -sha256
      - -days
      - "825"
      - -nodes
      - -keyout
      - "{{ hermes_nginx_tls_key }}"
      - -out
      - "{{ hermes_nginx_tls_cert }}"
      - -subj
      - "/CN={{ hermes_nginx_fqdn }}"
      - -addext
      - "subjectAltName=DNS:{{ hermes_nginx_fqdn }}"
    creates: "{{ hermes_nginx_tls_cert }}"
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_tls_enabled | bool
    - hermes_nginx_generate_self_signed_cert | bool

- name: Set Hermes nginx TLS private key permissions
  ansible.builtin.file:
    path: "{{ hermes_nginx_tls_key }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_tls_enabled | bool

- name: Set Hermes nginx TLS certificate permissions
  ansible.builtin.file:
    path: "{{ hermes_nginx_tls_cert }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_tls_enabled | bool

- name: Write Hermes nginx Basic Auth password file
  ansible.builtin.copy:
    dest: "{{ hermes_nginx_basic_auth_file }}"
    owner: root
    group: nginx
    mode: "0640"
    content: |
      {{ hermes_nginx_basic_auth_user }}:{{ hermes_nginx_basic_auth_password | password_hash('sha512', hermes_nginx_basic_auth_user) }}
  no_log: true
  notify: restart nginx
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_basic_auth_enabled | bool

- name: Remove Hermes nginx Basic Auth password file when disabled
  ansible.builtin.file:
    path: "{{ hermes_nginx_basic_auth_file }}"
    state: absent
  notify: restart nginx
  when:
    - hermes_nginx_enabled | bool
    - not (hermes_nginx_basic_auth_enabled | bool)

- name: Remove legacy Hermes nginx reverse proxy config path
  ansible.builtin.file:
    path: /etc/nginx/conf.d/hermes.conf
    state: absent
  notify: restart nginx
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_conf != '/etc/nginx/conf.d/hermes.conf'

- name: Write Hermes nginx reverse proxy config
  ansible.builtin.template:
    src: nginx-hermes.conf.j2
    dest: "{{ hermes_nginx_conf }}"
    owner: root
    group: root
    mode: "0644"
  notify: restart nginx
  when: hermes_nginx_enabled | bool

- name: Allow nginx to proxy Hermes dashboard under SELinux
  ansible.builtin.command:
    cmd: setsebool -P httpd_can_network_connect 1
  changed_when: false
  failed_when: false
  when: hermes_nginx_enabled | bool

- name: Validate nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
  when: hermes_nginx_enabled | bool

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
  when: hermes_nginx_enabled | bool

- name: Remove legacy http/https firewalld services for Hermes nginx
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--remove-service={{ item }}"
  loop:
    - http
    - https
  register: hermes_nginx_legacy_firewalld_service_result
  changed_when:
    - "'success' in hermes_nginx_legacy_firewalld_service_result.stdout"
    - "'NOT_ENABLED' not in hermes_nginx_legacy_firewalld_service_result.stderr"
  failed_when:
    - hermes_nginx_legacy_firewalld_service_result.rc != 0
    - "'NOT_ENABLED' not in hermes_nginx_legacy_firewalld_service_result.stderr"
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_enable_firewall | bool

- name: Open configured ports in firewalld for Hermes nginx
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--add-port={{ item }}"
  loop: "{{ firewalld_open_ports }}"
  register: hermes_nginx_firewalld_result
  changed_when:
    - "'success' in hermes_nginx_firewalld_result.stdout"
    - "'ALREADY_ENABLED' not in hermes_nginx_firewalld_result.stderr"
  failed_when:
    - hermes_nginx_firewalld_result.rc != 0
    - "'ALREADY_ENABLED' not in hermes_nginx_firewalld_result.stderr"
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_enable_firewall | bool
    - firewalld_open_ports | length > 0

- name: Reload firewalld after Hermes nginx service changes
  ansible.builtin.command:
    cmd: firewall-cmd --reload
  changed_when: false
  failed_when: false
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_enable_firewall | bool
    - firewalld_open_ports | length > 0
...
