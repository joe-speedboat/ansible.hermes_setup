---
- name: Validate Hermes nginx reverse proxy settings
  ansible.builtin.assert:
    that:
      - hermes_dashboard_nginx_fqdn | length > 0
      - hermes_dashboard_host | length > 0
      - hermes_nginx_tls_enabled | bool
    fail_msg: >-
      hermes_nginx_enabled requires a non-empty hermes_dashboard_nginx_fqdn, a valid dashboard bind address, and TLS enabled. Use one DNS vhost per Hermes Linux user.
  when: hermes_nginx_enabled | bool

- name: Validate Hermes WebUI nginx reverse proxy settings
  ansible.builtin.assert:
    that:
      - hermes_webui_nginx_fqdn | length > 0
      - hermes_webui_host in ['127.0.0.1', 'localhost', '::1']
      - hermes_webui_nginx_fqdn != hermes_dashboard_nginx_fqdn
      - hermes_nginx_tls_enabled | bool
    fail_msg: >-
      hermes_nginx_enabled requires a non-empty hermes_webui_nginx_fqdn that differs from hermes_dashboard_nginx_fqdn, a valid WebUI bind address, and TLS enabled. Use separate DNS vhosts for the dashboard and WebUI.
  when:
    - hermes_nginx_enabled | bool
    - hermes_webui_enabled | bool

- name: Validate Hermes nginx Let's Encrypt settings
  ansible.builtin.assert:
    that:
      - hermes_nginx_letsencrypt_email | length > 0
      - hermes_nginx_letsencrypt_mode == 'combined'
      - hermes_nginx_letsencrypt_challenge_method in ['tls-alpn-01', 'webroot']
      - hermes_nginx_tls_enabled | bool
    fail_msg: >-
      hermes_nginx_letsencrypt_enabled requires a non-empty
      hermes_nginx_letsencrypt_email, TLS enabled, the internal combined
      certificate mode, and a supported ACME challenge method.
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_letsencrypt_enabled | bool

- name: Install nginx for Hermes reverse proxy
  ansible.builtin.dnf:
    name: >-
      {{
        ['nginx', 'openssl', 'policycoreutils-python-utils', 'firewalld']
        + ((hermes_nginx_letsencrypt_enabled | bool) | ternary(['certbot'], []))
      }}
    state: present
  when: hermes_nginx_enabled | bool

- name: Ensure Hermes nginx TLS directory exists
  ansible.builtin.file:
    path: "{{ hermes_nginx_tls_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_tls_enabled | bool

- name: Ensure Hermes nginx Let's Encrypt webroot exists
  ansible.builtin.file:
    path: "{{ hermes_nginx_letsencrypt_webroot }}/.well-known/acme-challenge"
    state: directory
    owner: root
    group: nginx
    mode: "0755"
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_letsencrypt_enabled | bool
    - hermes_nginx_letsencrypt_challenge_method == 'webroot'

- name: Generate self-signed Hermes nginx TLS certificate
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -newkey
      - rsa:4096
      - -sha256
      - -days
      - "825"
      - -nodes
      - -keyout
      - "{{ hermes_dashboard_nginx_tls_key }}"
      - -out
      - "{{ hermes_dashboard_nginx_tls_cert }}"
      - -subj
      - "/CN={{ hermes_dashboard_nginx_fqdn }}"
      - -addext
      - "subjectAltName=DNS:{{ hermes_dashboard_nginx_fqdn }}"
    creates: "{{ hermes_dashboard_nginx_tls_cert }}"
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_tls_enabled | bool
    - hermes_nginx_generate_self_signed_cert | bool

- name: Set Hermes nginx TLS private key permissions
  ansible.builtin.file:
    path: "{{ hermes_dashboard_nginx_tls_key }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_tls_enabled | bool

- name: Set Hermes nginx TLS certificate permissions
  ansible.builtin.file:
    path: "{{ hermes_dashboard_nginx_tls_cert }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_tls_enabled | bool

- name: Generate self-signed Hermes WebUI nginx TLS certificate
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -newkey
      - rsa:4096
      - -sha256
      - -days
      - "825"
      - -nodes
      - -keyout
      - "{{ hermes_webui_nginx_tls_key }}"
      - -out
      - "{{ hermes_webui_nginx_tls_cert }}"
      - -subj
      - "/CN={{ hermes_webui_nginx_fqdn }}"
      - -addext
      - "subjectAltName=DNS:{{ hermes_webui_nginx_fqdn }}"
    creates: "{{ hermes_webui_nginx_tls_cert }}"
  when:
    - hermes_nginx_enabled | bool
    - hermes_webui_enabled | bool
    - hermes_nginx_tls_enabled | bool
    - hermes_nginx_generate_self_signed_cert | bool

- name: Set Hermes WebUI nginx TLS private key permissions
  ansible.builtin.file:
    path: "{{ hermes_webui_nginx_tls_key }}"
    owner: root
    group: root
    mode: "0600"
  when:
    - hermes_nginx_enabled | bool
    - hermes_webui_enabled | bool
    - hermes_nginx_tls_enabled | bool

- name: Set Hermes WebUI nginx TLS certificate permissions
  ansible.builtin.file:
    path: "{{ hermes_webui_nginx_tls_cert }}"
    owner: root
    group: root
    mode: "0644"
  when:
    - hermes_nginx_enabled | bool
    - hermes_webui_enabled | bool
    - hermes_nginx_tls_enabled | bool

- name: Check existing Hermes Let's Encrypt certificate
  ansible.builtin.stat:
    path: "{{ hermes_nginx_letsencrypt_fullchain_path }}"
  register: hermes_nginx_letsencrypt_cert_stat
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_letsencrypt_enabled | bool

- name: Remove legacy Hermes nginx Basic Auth password file
  ansible.builtin.file:
    path: "/etc/nginx/.htpasswd-hermes-{{ hermes_dashboard_nginx_fqdn }}"
    state: absent
  notify: restart nginx
  when: hermes_nginx_enabled | bool

- name: Remove legacy Hermes nginx reverse proxy config path
  ansible.builtin.file:
    path: /etc/nginx/conf.d/hermes.conf
    state: absent
  notify: restart nginx
  when:
    - hermes_nginx_enabled | bool
    - hermes_dashboard_nginx_conf != '/etc/nginx/conf.d/hermes.conf'

- name: Remove Rocky nginx default HTTP server
  ansible.builtin.replace:
    path: /etc/nginx/nginx.conf
    regexp: '(?ms)\n    server \{\n        listen       80;\n        listen       \[::\]:80;\n        server_name  _;\n        root         /usr/share/nginx/html;\n\n        # Load configuration files for the default server block\.\n        include /etc/nginx/default\.d/\*\.conf;\n    \}\n'
    replace: "\n"
  notify: restart nginx
  when: hermes_nginx_enabled | bool

- name: Write Hermes nginx reverse proxy config
  ansible.builtin.template:
    src: nginx-hermes.conf.j2
    dest: "{{ hermes_dashboard_nginx_conf }}"
    owner: root
    group: root
    mode: "0644"
  vars:
    hermes_nginx_vhost_host: "{{ hermes_dashboard_host }}"
    hermes_nginx_vhost_tls_cert: >-
      {{
        (
          hermes_nginx_letsencrypt_enabled | bool
          and hermes_nginx_letsencrypt_cert_stat.stat.exists | default(false)
        ) | ternary(hermes_nginx_letsencrypt_fullchain_path, hermes_dashboard_nginx_tls_cert)
      }}
    hermes_nginx_vhost_tls_key: >-
      {{
        (
          hermes_nginx_letsencrypt_enabled | bool
          and hermes_nginx_letsencrypt_cert_stat.stat.exists | default(false)
        ) | ternary(hermes_nginx_letsencrypt_privkey_path, hermes_dashboard_nginx_tls_key)
      }}
  notify: restart nginx
  when: hermes_nginx_enabled | bool

- name: Remove legacy Hermes WebUI nginx Basic Auth password file
  ansible.builtin.file:
    path: "/etc/nginx/.htpasswd-hermes-{{ hermes_webui_nginx_fqdn }}"
    state: absent
  notify: restart nginx
  when:
    - hermes_nginx_enabled | bool
    - hermes_webui_enabled | bool

- name: Write Hermes WebUI nginx reverse proxy config
  ansible.builtin.template:
    src: nginx-hermes.conf.j2
    dest: "{{ hermes_webui_nginx_conf }}"
    owner: root
    group: root
    mode: "0644"
  vars:
    hermes_nginx_vhost_fqdn: "{{ hermes_webui_nginx_fqdn }}"
    hermes_nginx_vhost_port: "{{ hermes_webui_port }}"
    hermes_nginx_vhost_tls_cert: >-
      {{
        (
          hermes_nginx_letsencrypt_enabled | bool
          and hermes_nginx_letsencrypt_cert_stat.stat.exists | default(false)
        ) | ternary(hermes_nginx_letsencrypt_fullchain_path, hermes_webui_nginx_tls_cert)
      }}
    hermes_nginx_vhost_tls_key: >-
      {{
        (
          hermes_nginx_letsencrypt_enabled | bool
          and hermes_nginx_letsencrypt_cert_stat.stat.exists | default(false)
        ) | ternary(hermes_nginx_letsencrypt_privkey_path, hermes_webui_nginx_tls_key)
      }}
    hermes_nginx_vhost_preserve_public_host: true
  notify: restart nginx
  when:
    - hermes_nginx_enabled | bool
    - hermes_webui_enabled | bool

- name: Allow nginx to proxy Hermes dashboard under SELinux
  ansible.builtin.command:
    cmd: setsebool -P httpd_can_network_connect 1
  changed_when: false
  failed_when: false
  when: hermes_nginx_enabled | bool

- name: Validate nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
  when: hermes_nginx_enabled | bool

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
  when: hermes_nginx_enabled | bool

- name: Enable and start firewalld for Hermes nginx firewall management
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_enable_firewall | bool

- name: Build effective Hermes nginx firewall port list
  ansible.builtin.set_fact:
    hermes_nginx_effective_firewalld_open_ports: >-
      {{
        (
          firewalld_open_ports
          + ((hermes_nginx_http_enabled | bool) | ternary(['80/tcp'], []))
        ) | unique | list
      }}
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_enable_firewall | bool

- name: Remove legacy http/https firewalld services for Hermes nginx
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--remove-service={{ item }}"
  loop:
    - http
    - https
  register: hermes_nginx_legacy_firewalld_service_result
  changed_when:
    - "'success' in hermes_nginx_legacy_firewalld_service_result.stdout"
    - "'NOT_ENABLED' not in hermes_nginx_legacy_firewalld_service_result.stderr"
  failed_when:
    - hermes_nginx_legacy_firewalld_service_result.rc != 0
    - "'NOT_ENABLED' not in hermes_nginx_legacy_firewalld_service_result.stderr"
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_enable_firewall | bool

- name: Open configured ports in firewalld for Hermes nginx
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--add-port={{ item }}"
  loop: "{{ hermes_nginx_effective_firewalld_open_ports | default(firewalld_open_ports) }}"
  register: hermes_nginx_firewalld_result
  changed_when:
    - "'success' in hermes_nginx_firewalld_result.stdout"
    - "'ALREADY_ENABLED' not in hermes_nginx_firewalld_result.stderr"
  failed_when:
    - hermes_nginx_firewalld_result.rc != 0
    - "'ALREADY_ENABLED' not in hermes_nginx_firewalld_result.stderr"
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_enable_firewall | bool
    - hermes_nginx_effective_firewalld_open_ports | default(firewalld_open_ports) | length > 0

- name: Remove HTTP port from firewalld for HTTPS-only Hermes nginx
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --remove-port=80/tcp
  register: hermes_nginx_http_firewalld_result
  changed_when:
    - "'success' in hermes_nginx_http_firewalld_result.stdout"
    - "'NOT_ENABLED' not in hermes_nginx_http_firewalld_result.stderr"
  failed_when:
    - hermes_nginx_http_firewalld_result.rc != 0
    - "'NOT_ENABLED' not in hermes_nginx_http_firewalld_result.stderr"
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_enable_firewall | bool
    - not hermes_nginx_http_enabled | bool

- name: Reload firewalld after Hermes nginx service changes
  ansible.builtin.command:
    cmd: firewall-cmd --reload
  changed_when: false
  failed_when: false
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_enable_firewall | bool
    - hermes_nginx_effective_firewalld_open_ports | default(firewalld_open_ports) | length > 0

- name: Install Let's Encrypt nginx deploy hook directory
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_letsencrypt_enabled | bool

- name: Install Let's Encrypt nginx deploy hook
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      systemctl reload nginx || systemctl restart nginx
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_letsencrypt_enabled | bool

- name: Apply Hermes nginx ACME challenge config before Let's Encrypt request
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
  changed_when: false
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_letsencrypt_enabled | bool
    - hermes_nginx_letsencrypt_challenge_method == 'webroot'

- name: Request combined Let's Encrypt certificate for Hermes nginx vhosts
  ansible.builtin.command: >-
    certbot certonly
    {{
      (
        '--webroot --webroot-path ' ~ (hermes_nginx_letsencrypt_webroot | quote)
        if hermes_nginx_letsencrypt_challenge_method == 'webroot'
        else '--standalone --preferred-challenges tls-alpn-01 --pre-hook "systemctl stop nginx" --post-hook "systemctl start nginx"'
      )
    }}
    --non-interactive
    --agree-tos
    --email {{ hermes_nginx_letsencrypt_email | quote }}
    --cert-name {{ hermes_nginx_letsencrypt_cert_name | quote }}
    -d {{ hermes_dashboard_nginx_fqdn | quote }}
    {{ (hermes_webui_enabled | bool) | ternary('-d ' + (hermes_webui_nginx_fqdn | quote), '') }}
    {{ (hermes_nginx_letsencrypt_staging | bool) | ternary('--staging', '') }}
  register: hermes_nginx_letsencrypt_result
  changed_when: >-
    'Successfully received certificate' in hermes_nginx_letsencrypt_result.stdout
    or 'Congratulations!' in hermes_nginx_letsencrypt_result.stdout
  notify: restart nginx
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_letsencrypt_enabled | bool

- name: Check Hermes Let's Encrypt certificate after request
  ansible.builtin.stat:
    path: "{{ hermes_nginx_letsencrypt_fullchain_path }}"
  register: hermes_nginx_letsencrypt_cert_stat_after_request
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_letsencrypt_enabled | bool

- name: Re-render Hermes nginx reverse proxy config with Let's Encrypt certificate
  ansible.builtin.template:
    src: nginx-hermes.conf.j2
    dest: "{{ hermes_dashboard_nginx_conf }}"
    owner: root
    group: root
    mode: "0644"
  vars:
    hermes_nginx_vhost_tls_cert: "{{ hermes_nginx_letsencrypt_fullchain_path }}"
    hermes_nginx_vhost_tls_key: "{{ hermes_nginx_letsencrypt_privkey_path }}"
    hermes_nginx_vhost_host: "{{ hermes_dashboard_host }}"
    hermes_nginx_vhost_port: "{{ hermes_dashboard_port }}"
  notify: restart nginx
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_letsencrypt_enabled | bool
    - hermes_nginx_letsencrypt_cert_stat_after_request.stat.exists | default(false)

- name: Re-render Hermes WebUI nginx reverse proxy config with Let's Encrypt certificate
  ansible.builtin.template:
    src: nginx-hermes.conf.j2
    dest: "{{ hermes_webui_nginx_conf }}"
    owner: root
    group: root
    mode: "0644"
  vars:
    hermes_nginx_vhost_fqdn: "{{ hermes_webui_nginx_fqdn }}"
    hermes_nginx_vhost_port: "{{ hermes_webui_port }}"
    hermes_nginx_vhost_tls_cert: "{{ hermes_nginx_letsencrypt_fullchain_path }}"
    hermes_nginx_vhost_tls_key: "{{ hermes_nginx_letsencrypt_privkey_path }}"
    hermes_nginx_vhost_preserve_public_host: true
  notify: restart nginx
  when:
    - hermes_nginx_enabled | bool
    - hermes_webui_enabled | bool
    - hermes_nginx_letsencrypt_enabled | bool
    - hermes_nginx_letsencrypt_cert_stat_after_request.stat.exists | default(false)

- name: Validate nginx configuration after Let's Encrypt certificate switch
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_letsencrypt_enabled | bool
    - hermes_nginx_letsencrypt_cert_stat_after_request.stat.exists | default(false)

- name: Enable certbot renewal timer when available
  ansible.builtin.systemd:
    name: certbot-renew.timer
    enabled: true
    state: started
  failed_when: false
  when:
    - hermes_nginx_enabled | bool
    - hermes_nginx_letsencrypt_enabled | bool
...
