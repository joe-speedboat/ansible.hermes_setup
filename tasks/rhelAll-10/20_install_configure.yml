---
- name: Check whether Hermes CLI is already installed
  ansible.builtin.stat:
    path: "{{ hermes_bin_path }}"
  register: hermes_cli_stat

- name: Install Hermes Agent with official installer
  ansible.builtin.shell: |
    set -o pipefail
    runuser -u {{ hermes_user }} -- bash -lc 'curl -fsSL {{ hermes_install_url | quote }} | bash -s -- --skip-setup --skip-browser'
  args:
    executable: /bin/bash
    creates: "{{ hermes_bin_path }}"
  when:
    - hermes_install_if_missing | bool
    - not hermes_cli_stat.stat.exists

- name: Ensure Hermes config directory exists
  ansible.builtin.file:
    path: "{{ hermes_config_dir }}"
    state: directory
    owner: "{{ hermes_user }}"
    group: "{{ hermes_group }}"
    mode: '0700'

- name: Configure Hermes Codex provider default
  ansible.builtin.command: >-
    runuser -u {{ hermes_user }} -- env HOME={{ hermes_home }}
    {{ hermes_bin_path }} config set model.provider {{ hermes_codex_provider }}
  changed_when: false
  when: configure_codex | bool

- name: Configure Hermes Codex model default
  ansible.builtin.command: >-
    runuser -u {{ hermes_user }} -- env HOME={{ hermes_home }}
    {{ hermes_bin_path }} config set model.default {{ hermes_codex_model }}
  changed_when: false
  when: configure_codex | bool

- name: Remove custom model base_url when Codex is selected
  ansible.builtin.lineinfile:
    path: "{{ hermes_config_dir }}/config.yaml"
    regexp: '^  base_url:'
    state: absent
    owner: "{{ hermes_user }}"
    group: "{{ hermes_group }}"
    mode: '0600'
  when: configure_codex | bool

- name: Validate Hermes dashboard application authentication settings
  ansible.builtin.assert:
    that:
      - hermes_dashboard_auth_username | length > 0
      - (hermes_dashboard_auth_password_hash | length > 0) or (hermes_dashboard_auth_password | length > 0)
    fail_msg: >-
      Dashboard application authentication requires a username and either
      hermes_dashboard_auth_password_hash or hermes_dashboard_auth_password.
  no_log: true
  when:
    - hermes_dashboard_enabled | bool
    - hermes_dashboard_auth_username | length > 0 or hermes_dashboard_auth_password_hash | length > 0 or hermes_dashboard_auth_password | length > 0

- name: Read current Hermes dashboard application authentication settings
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ hermes_user }}"
      - --
      - env
      - "HOME={{ hermes_home }}"
      - "{{ hermes_bin_path }}"
      - config
      - get
      - "dashboard.basic_auth.{{ item }}"
  loop:
    - username
    - password_hash
    - password
    - secret
    - session_ttl_seconds
  register: hermes_dashboard_auth_current
  no_log: true
  changed_when: false
  failed_when: false
  when: hermes_dashboard_enabled | bool

- name: Remove empty Hermes dashboard application authentication settings
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ hermes_user }}"
      - --
      - env
      - "HOME={{ hermes_home }}"
      - "{{ hermes_bin_path }}"
      - config
      - unset
      - "dashboard.basic_auth.{{ item.key }}"
  loop:
    - { key: username, value: "{{ hermes_dashboard_auth_username }}" }
    - { key: password_hash, value: "{{ hermes_dashboard_auth_password_hash }}" }
    - { key: password, value: "{{ hermes_dashboard_auth_password }}" }
    - { key: secret, value: "{{ hermes_dashboard_auth_secret }}" }
    - { key: session_ttl_seconds, value: "{{ hermes_dashboard_auth_ttl_seconds }}" }
  loop_control:
    index_var: hermes_dashboard_auth_index
  no_log: true
  changed_when: true
  notify: restart Hermes dashboard
  when:
    - hermes_dashboard_enabled | bool
    - item.value | string | length == 0
    - hermes_dashboard_auth_current.results[hermes_dashboard_auth_index].rc == 0
    - hermes_dashboard_auth_current.results[hermes_dashboard_auth_index].stdout | trim | length > 0

- name: Configure Hermes dashboard application authentication
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - "{{ hermes_user }}"
      - --
      - env
      - "HOME={{ hermes_home }}"
      - "{{ hermes_bin_path }}"
      - config
      - set
      - "dashboard.basic_auth.{{ item.key }}"
      - "{{ item.value }}"
  loop:
    - { key: username, value: "{{ hermes_dashboard_auth_username }}" }
    - { key: password_hash, value: "{{ hermes_dashboard_auth_password_hash }}" }
    - { key: password, value: "{{ hermes_dashboard_auth_password }}" }
    - { key: secret, value: "{{ hermes_dashboard_auth_secret }}" }
    - { key: session_ttl_seconds, value: "{{ hermes_dashboard_auth_ttl_seconds }}" }
  loop_control:
    index_var: hermes_dashboard_auth_index
  no_log: true
  changed_when: true
  notify: restart Hermes dashboard
  when:
    - hermes_dashboard_enabled | bool
    - item.value | string | length > 0
    - hermes_dashboard_auth_current.results[hermes_dashboard_auth_index].rc != 0 or hermes_dashboard_auth_current.results[hermes_dashboard_auth_index].stdout | trim != item.value | string | trim

- name: Print manual Codex authentication instructions
  ansible.builtin.debug:
    msg:
      - "Codex defaults were written for user {{ hermes_user }}."
      - "Manual OAuth step is still required because the role does not handle secrets or device-code auth."
      - "Run: sudo -iu {{ hermes_user }} hermes auth add {{ hermes_codex_provider }}"
      - "Alternative interactive setup: sudo -iu {{ hermes_user }} hermes model"
  when: configure_codex | bool


- name: Ensure Hermes WebUI parent directory exists
  ansible.builtin.file:
    path: "{{ hermes_webui_app_dir | dirname }}"
    state: directory
    owner: "{{ hermes_user }}"
    group: "{{ hermes_group }}"
    mode: '0755'
  when: hermes_webui_enabled | bool

- name: Clone or update Hermes WebUI repository
  ansible.builtin.git:
    repo: "{{ hermes_webui_repo_url }}"
    dest: "{{ hermes_webui_app_dir }}"
    version: "{{ hermes_webui_repo_version }}"
    update: true
  become: true
  become_user: "{{ hermes_user }}"
  when: hermes_webui_enabled | bool

- name: Ensure Hermes WebUI state and workspace directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ hermes_user }}"
    group: "{{ hermes_group }}"
    mode: '0755'
  loop:
    - "{{ hermes_webui_state_dir }}"
    - "{{ hermes_webui_default_workspace }}"
  when: hermes_webui_enabled | bool

- name: Write Hermes WebUI environment file
  ansible.builtin.template:
    src: hermes-webui.env.j2
    dest: "{{ hermes_webui_app_dir }}/.env"
    owner: "{{ hermes_user }}"
    group: "{{ hermes_group }}"
    mode: '0640'
  no_log: true
  notify: restart Hermes WebUI
  when: hermes_webui_enabled | bool

- name: Check Hermes version
  ansible.builtin.command: >-
    runuser -u {{ hermes_user }} -- env HOME={{ hermes_home }}
    {{ hermes_bin_path }} --version
  register: hermes_version_result
  changed_when: false

- name: Show installed Hermes version
  ansible.builtin.debug:
    var: hermes_version_result.stdout_lines
...
