---
- name: Print Hermes post-install commands
  ansible.builtin.debug:
    msg:
      - "Hermes Agent is installed for user {{ hermes_user }}."
      - "Authenticate Codex: sudo -iu {{ hermes_user }} hermes auth add {{ hermes_codex_provider }}"
      - "Interactive model/provider setup: sudo -iu {{ hermes_user }} hermes model"
      - "Configure messaging platforms such as Telegram: sudo -iu {{ hermes_user }} hermes gateway setup"
      - "Install gateway service: sudo -iu {{ hermes_user }} hermes gateway install"
      - "Start gateway service: sudo -iu {{ hermes_user }} hermes gateway start"
      - "Check gateway status: sudo -iu {{ hermes_user }} hermes gateway status"
      - "Approve a Telegram pairing request after the user messages the bot: sudo -iu {{ hermes_user }} hermes pairing approve telegram <CODE>"
      - "List pending/approved pairings: sudo -iu {{ hermes_user }} hermes pairing list"
      - "Dashboard is optional. Enable it with Ansible var hermes_dashboard_enabled: true. Current value: {{ hermes_dashboard_enabled | bool }}"
...
