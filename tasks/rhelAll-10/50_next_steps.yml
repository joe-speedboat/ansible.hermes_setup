---
- name: Show Hermes post-install next steps
  ansible.builtin.debug:
    msg:
      - "Hermes Agent installation finished. Full detailed setup reference:"
      - "https://github.com/joe-speedboat/ansible.hermes_setup/blob/master/docs/manual-setup-rocky10.md"
      - ""
      - "Next steps:"
      - "1. Finish Codex authentication:"
      - "   sudo -iu {{ hermes_user }} hermes auth add openai-codex"
      - ""
      - "2. Restart Hermes user services after changing Hermes config/auth:"
      - "   sudo -iu {{ hermes_user }} systemctl --user restart hermes-gateway.service"
      - "   sudo -iu {{ hermes_user }} systemctl --user restart hermes-dashboard.service"
      - ""
      - "3. Dashboard access:"
      - "   Local loopback check: curl -fsS http://127.0.0.1:{{ hermes_dashboard_port }} >/dev/null"
      - "   Do not expose {{ hermes_dashboard_port }}/tcp directly. Prefer hermes_nginx_enabled: true for HTTPS; authentication is configured in the dashboard application."
      - "   For multiple Hermes users, use one DNS vhost per Linux user and dashboard port."
      - ""
      - "4. If nginx is enabled, verify the public endpoint:"
      - "   sudo nginx -t"
      - "   curl -skI https://{{ hermes_dashboard_nginx_fqdn | default('<fqdn>') }}/ | sed -n '1,8p'"
...
