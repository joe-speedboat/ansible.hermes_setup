---
# User and installation
hermes_user: hermes
hermes_group: "{{ hermes_user }}"
hermes_home: "/home/{{ hermes_user }}"
hermes_shell: /bin/bash
hermes_install_url: https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh
hermes_install_if_missing: true

# Base packages required for Hermes CLI, optional dashboard, systemd user services, and admin troubleshooting.
hermes_base_packages:
  - bash
  - ca-certificates
  - curl
  - git
  - jq
  - openssl
  - python3
  - python3-pip
  - tar
  - unzip
  - which
  - nodejs
  - npm

# Dashboard systemd user service. Disabled by default; set hermes_dashboard_enabled: true to install it.
hermes_dashboard_enabled: false
hermes_dashboard_service_enabled: true
hermes_dashboard_service_state: started
hermes_dashboard_host: 0.0.0.0
hermes_dashboard_port: 8080
hermes_dashboard_insecure: true
hermes_dashboard_extra_args: ""

# Configure default LLM provider/model for OpenAI Codex OAuth.
# This writes only non-secret defaults. Authentication remains manual:
#   sudo -iu hermes hermes auth add openai-codex
configure_codex: true
hermes_codex_provider: openai-codex
hermes_codex_model: gpt-5.5

# Optional Playwright setup for Hermes browser/dashboard smoke tests.
hermes_playwright_enabled: false
hermes_playwright_package_state: present
hermes_playwright_browsers:
  - chromium
hermes_playwright_ldd_check_enabled: true
hermes_playwright_smoke_test_enabled: true
hermes_playwright_runtime_packages:
  - liberation-fonts
  - dejavu-sans-fonts
  - pulseaudio-libs
  - libxshmfence
  - nspr
  - nss
  - nss-util
  - alsa-lib
  - atk
  - at-spi2-atk
  - at-spi2-core
  - cups-libs
  - mesa-libgbm
  - libdrm
  - libX11
  - libxcb
  - libXcomposite
  - libXdamage
  - libXext
  - libXfixes
  - libxkbcommon
  - libXrandr
  - pango
  - cairo
  - gdk-pixbuf2
  - gtk3

# Safety defaults
hermes_remove_from_wheel: true
hermes_enable_linger: true
...
