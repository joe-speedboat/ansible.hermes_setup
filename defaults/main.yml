---
# User and installation
hermes_user: hermes
hermes_group: "{{ hermes_user }}"
hermes_home: "/home/{{ hermes_user }}"
hermes_shell: /bin/bash
hermes_install_url: https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh
hermes_install_if_missing: true

# Optional Ansible userspace control-node runtime for the dedicated Hermes user.
# Installs via https://github.com/joe-speedboat/ansible.installer into hermes_home.
ansible_enable: false
ansible_install_url: https://ansible-uv.bitbull.ch
ansible_home: "{{ hermes_home }}/ansible"

# Repository packages installed before Hermes application dependencies.
# Use this first stage for repositories such as EPEL/RPM Fusion that provide
# packages needed by Hermes and its optional tooling.
hermes_repo_packages:
  - epel-release

hermes_base_packages:
  - bash
  - ca-certificates
  - curl
  - git
  - ffmpeg-free
  - jq
  - openssl
  - python3
  - python3-pip
  - ripgrep
  - tar
  - unzip
  - which
  - nodejs
  - npm

# Gateway systemd user service. Installed and enabled by default; platform pairing/tokens remain manual.
hermes_gateway_enabled: true
hermes_gateway_service_enabled: true
hermes_gateway_service_state: started
hermes_gateway_extra_args: ""

# Dashboard systemd user service. Installed and enabled by default, but the firewall is not opened by this role.
# For production, keep this bound to 127.0.0.1 and expose it through nginx with TLS + Basic Auth.
hermes_dashboard_enabled: true
hermes_dashboard_service_enabled: true
hermes_dashboard_service_state: started
hermes_dashboard_host: 127.0.0.1
hermes_dashboard_port: 8080
hermes_dashboard_insecure: false
hermes_dashboard_extra_args: ""

# Optional Hermes WebUI service (https://github.com/nesquena/hermes-webui).
# This is a second browser interface next to the built-in Hermes dashboard.
# Keep it bound to loopback and expose it through its own nginx DNS vhost.
hermes_webui_enabled: false
hermes_webui_service_enabled: true
hermes_webui_service_state: started
hermes_webui_repo_url: https://github.com/nesquena/hermes-webui.git
hermes_webui_repo_version: master
hermes_webui_app_dir: "{{ hermes_home }}/app/hermes-webui"
hermes_webui_host: 127.0.0.1
hermes_webui_port: 8787
hermes_webui_state_dir: "{{ hermes_config_dir }}/webui"
hermes_webui_default_workspace: "{{ hermes_home }}/work"
hermes_webui_allowed_origins: "https://{{ hermes_webui_nginx_fqdn }}"
hermes_webui_extra_args: ""

# Optional nginx reverse proxy for the Hermes dashboard. The intended multi-user
# pattern is one Linux user + one loopback dashboard port + one DNS vhost per
# Hermes instance, for example chris-hermes.example.ch -> 127.0.0.1:8081.
hermes_nginx_enabled: true
hermes_nginx_fqdn: "{{ ansible_fqdn | default(inventory_hostname) }}"
hermes_nginx_conf: "/etc/nginx/conf.d/{{ hermes_nginx_fqdn }}.conf"
hermes_nginx_client_max_body_size: 100m
hermes_nginx_enable_firewall: true
firewalld_open_ports:
  - 443/tcp

hermes_nginx_tls_enabled: true
hermes_nginx_tls_dir: /etc/pki/tls/hermes
hermes_nginx_tls_cert: "{{ hermes_nginx_tls_dir }}/{{ hermes_nginx_fqdn }}_tls.crt"
hermes_nginx_tls_key: "{{ hermes_nginx_tls_dir }}/{{ hermes_nginx_fqdn }}_tls.key"
hermes_nginx_generate_self_signed_cert: true

hermes_nginx_basic_auth_enabled: true
hermes_nginx_basic_auth_file: /etc/nginx/.htpasswd-hermes-{{ hermes_nginx_fqdn }}
hermes_nginx_basic_auth_realm: "{{ hermes_nginx_fqdn }}"
hermes_nginx_basic_auth_user: hermes
hermes_nginx_basic_auth_password: changeme

# Optional nginx reverse proxy for Hermes WebUI. This intentionally uses a
# separate FQDN/vhost from the built-in Hermes dashboard.
hermes_webui_nginx_fqdn: "webui-{{ hermes_nginx_fqdn }}"
hermes_webui_nginx_conf: "/etc/nginx/conf.d/{{ hermes_webui_nginx_fqdn }}.conf"
hermes_webui_nginx_tls_cert: "{{ hermes_nginx_tls_dir }}/{{ hermes_webui_nginx_fqdn }}_tls.crt"
hermes_webui_nginx_tls_key: "{{ hermes_nginx_tls_dir }}/{{ hermes_webui_nginx_fqdn }}_tls.key"
hermes_webui_nginx_basic_auth_file: /etc/nginx/.htpasswd-hermes-{{ hermes_webui_nginx_fqdn }}
hermes_webui_nginx_basic_auth_realm: "{{ hermes_webui_nginx_fqdn }}"
hermes_webui_nginx_basic_auth_user: "{{ hermes_nginx_basic_auth_user }}"
hermes_webui_nginx_basic_auth_password: "{{ hermes_nginx_basic_auth_password }}"

# Configure default LLM provider/model for OpenAI Codex OAuth.
# This writes only non-secret defaults. Authentication remains manual:
#   sudo -iu hermes hermes auth add openai-codex
configure_codex: true
hermes_codex_provider: openai-codex
hermes_codex_model: gpt-5.5

# Playwright setup for Hermes browser/dashboard smoke tests. Enabled by default so
# browser-capable Hermes installs work immediately on Rocky/RHEL 10 systems.
hermes_playwright_enabled: true
hermes_playwright_package_state: present
hermes_playwright_browsers:
  - chromium
hermes_playwright_ldd_check_enabled: true
hermes_playwright_smoke_test_enabled: true
# Optional build tools for npm modules that have to compile from source
# (for example node-pty on some Node/Rocky combinations). Keep disabled for
# production unless a lab/provisioning run proves they are needed.
hermes_playwright_build_tools_enabled: false
hermes_playwright_build_tools_packages:
  - make
  - gcc
  - gcc-c++

hermes_playwright_runtime_packages:
  - liberation-fonts
  - dejavu-sans-fonts
  - pulseaudio-libs
  - libxshmfence
  - nspr
  - nss
  - nss-util
  - alsa-lib
  - atk
  - at-spi2-atk
  - at-spi2-core
  - cups-libs
  - mesa-libgbm
  - libdrm
  - libX11
  - libxcb
  - libXcomposite
  - libXdamage
  - libXext
  - libXfixes
  - libxkbcommon
  - libXrandr
  - pango
  - cairo
  - gdk-pixbuf2
  - gtk3

# Safety defaults
hermes_remove_from_wheel: true
hermes_enable_linger: true
...
