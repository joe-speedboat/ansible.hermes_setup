---
# User and installation
hermes_user: hermes
hermes_group: "{{ hermes_user }}"
hermes_home: "/home/{{ hermes_user }}"
hermes_shell: /bin/bash
hermes_install_url: https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh
hermes_install_if_missing: true

# Optional Ansible userspace control-node runtime for the dedicated Hermes user.
# Installs via https://github.com/joe-speedboat/ansible.installer into hermes_home.
ansible_enable: false
ansible_install_url: https://ansible-uv.bitbull.ch
ansible_home: "{{ hermes_home }}/ansible"

# Repository packages installed before Hermes application dependencies.
# Use this first stage for repositories such as EPEL/RPM Fusion that provide
# packages needed by Hermes and its optional tooling.
hermes_repo_packages:
  - epel-release

hermes_base_packages:
  - bash
  - ca-certificates
  - curl
  - git
  - gh
  - ffmpeg-free
  - jq
  - openssl
  - python3
  - python3-pip
  - ripgrep
  - tar
  - unzip
  - which
  - nodejs
  - npm

# Packages required only for the optional persistent SSH client state.
hermes_ssh_packages:
  - openssh-clients

# Keep the Node.js runtime and its shared-library dependencies synchronized.
# `state: latest` repairs hosts where nodejs-libs and c-ares were left at
# incompatible versions by a partial package update.
hermes_node_packages:
  - nodejs
  - nodejs-libs
  - npm
  - c-ares

hermes_gateway_enabled: true
hermes_gateway_service_enabled: true
hermes_gateway_service_state: started
hermes_gateway_extra_args: ""

# Dashboard systemd user service. Installed and enabled by default, but the firewall is not opened by this role.
# For production, keep this bound to 127.0.0.1 and expose it through nginx with TLS.
hermes_dashboard_enabled: true
hermes_dashboard_service_enabled: true
hermes_dashboard_service_state: started
# Bind to the host's primary address so Hermes' own auth gate protects
# reverse-proxy requests. Port 8080 is not opened by this role; nginx remains
# the public entry point.
hermes_dashboard_host: "{{ ansible_default_ipv4.address | default('127.0.0.1') }}"
hermes_dashboard_port: 8080
hermes_dashboard_insecure: false
hermes_dashboard_extra_args: ""
# Application-side dashboard credentials. Hermes reads these from config.yaml.
# Prefer password_hash (generated with the upstream scrypt helper) over plaintext.
hermes_dashboard_auth_username: ""
hermes_dashboard_auth_password_hash: ""
hermes_dashboard_auth_password: ""
hermes_dashboard_auth_secret: ""
hermes_dashboard_auth_ttl_seconds: 0

# Hermes WebUI service. Installed and enabled by default alongside the dashboard.
# Keep it bound to loopback and expose it through its own nginx DNS vhost.
hermes_webui_enabled: true
hermes_webui_service_enabled: true
hermes_webui_service_state: started
hermes_webui_repo_url: https://github.com/nesquena/hermes-webui.git
hermes_webui_repo_version: master
hermes_webui_app_dir: "{{ hermes_home }}/app/hermes-webui"
hermes_webui_host: 127.0.0.1
hermes_webui_port: 8787
hermes_webui_state_dir: "{{ hermes_config_dir }}/webui"
hermes_webui_default_workspace: "{{ hermes_home }}/work"
hermes_webui_allowed_origins: "https://{{ hermes_webui_nginx_fqdn }}"
# Maximum WebUI upload size in MiB. Keep the nginx limit derived from this
# value so the reverse proxy does not reject uploads before the WebUI does.
hermes_webui_max_upload_mb: 220
# The WebUI authenticates itself with this optional application password.
hermes_webui_password: ""
hermes_webui_extra_args: ""

# Optional SSH client state for the Hermes user.
# The keypair is generated only when missing; existing private keys are never replaced.
hermes_ssh_setup: true
hermes_ssh_generate_key: "{{ hermes_ssh_setup }}"
hermes_ssh_key_type: ed25519
hermes_ssh_key_path: "{{ hermes_home }}/.ssh/id_ed25519"
hermes_ssh_known_hosts_path: "{{ hermes_home }}/.ssh/known_hosts"

# Optional controller-side bootstrap content for an existing Hermes home.
# `missing` preserves target files; `overwrite` replaces matching content.
# auth.json is excluded unless hermes_bootstrap_include_auth is explicitly true.
hermes_bootstrap_dir: ""
hermes_bootstrap_mode: disabled
hermes_bootstrap_include_auth: false
hermes_bootstrap_items:
  - source: SOUL.md
    destination: "{{ hermes_config_dir }}/SOUL.md"
    mode: '0600'
  - source: config.yaml
    destination: "{{ hermes_config_dir }}/config.yaml"
    mode: '0600'
  - source: .env
    destination: "{{ hermes_config_dir }}/.env"
    mode: '0600'
  - source: memories/
    destination: "{{ hermes_config_dir }}/memories"
  - source: skills/
    destination: "{{ hermes_config_dir }}/skills"
  - source: plugins/
    destination: "{{ hermes_config_dir }}/plugins"
  - source: cron/
    destination: "{{ hermes_config_dir }}/cron"
  - source: workspace/
    destination: "{{ hermes_webui_default_workspace }}"


# Optional nginx reverse proxy for the Hermes dashboard. The intended multi-user
# pattern is one Linux user + one loopback dashboard port + one DNS vhost per
# Hermes instance, for example chris-hermes.example.ch -> 127.0.0.1:8081.
hermes_nginx_enabled: true
hermes_nginx_http_enabled: true
hermes_dashboard_nginx_fqdn: "adm-{{ ansible_fqdn | default(inventory_hostname) }}"
hermes_dashboard_nginx_conf: "/etc/nginx/conf.d/{{ hermes_dashboard_nginx_fqdn }}.conf"
# Keep nginx aligned with the WebUI upload limit by default. Override this
# explicitly only when the reverse-proxy limit is intentionally different.
hermes_nginx_client_max_body_size: "{{ hermes_webui_max_upload_mb }}m"
hermes_nginx_enable_firewall: true
firewalld_open_ports:
  - 443/tcp

hermes_nginx_tls_enabled: true
hermes_nginx_tls_dir: /etc/pki/tls/hermes
hermes_dashboard_nginx_tls_cert: "{{ hermes_nginx_tls_dir }}/{{ hermes_dashboard_nginx_fqdn }}_tls.crt"
hermes_dashboard_nginx_tls_key: "{{ hermes_nginx_tls_dir }}/{{ hermes_dashboard_nginx_fqdn }}_tls.key"
hermes_nginx_generate_self_signed_cert: true
hermes_nginx_letsencrypt_enabled: false
hermes_nginx_letsencrypt_email: "{{ hermes_user }}@{{ hermes_webui_nginx_fqdn }}"
hermes_nginx_letsencrypt_challenge_method: webroot

# Optional nginx reverse proxy for Hermes WebUI. This intentionally uses a
# separate FQDN/vhost from the built-in Hermes dashboard.
hermes_webui_nginx_fqdn: "{{ ansible_fqdn | default(inventory_hostname) }}"
hermes_webui_nginx_conf: "/etc/nginx/conf.d/{{ hermes_webui_nginx_fqdn }}.conf"
hermes_webui_nginx_tls_cert: "{{ hermes_nginx_tls_dir }}/{{ hermes_webui_nginx_fqdn }}_tls.crt"
hermes_webui_nginx_tls_key: "{{ hermes_nginx_tls_dir }}/{{ hermes_webui_nginx_fqdn }}_tls.key"
# Authentication is provided by the WebUI application, not nginx.

# Configure default LLM provider/model for OpenAI Codex OAuth.
# This writes only non-secret defaults. Authentication remains manual:
#   sudo -iu hermes hermes auth add openai-codex
configure_codex: true
hermes_codex_provider: openai-codex
hermes_codex_model: gpt-5.5

# Playwright setup for Hermes browser/dashboard smoke tests. Enabled by default so
# browser-capable Hermes installs work immediately on Rocky/RHEL 10 systems.
hermes_playwright_enabled: true
hermes_playwright_package_state: present
hermes_playwright_browsers:
  - chromium
hermes_playwright_ldd_check_enabled: true
hermes_playwright_smoke_test_enabled: true
# Build tools for npm modules that may have to compile from source
# (for example node-pty on some Node/Rocky combinations). Enabled by default
# because Playwright support is enabled by default and fresh Rocky 10 minimal
# hosts otherwise cannot converge when npm falls back to node-gyp builds.
hermes_playwright_build_tools_enabled: true
hermes_playwright_build_tools_packages:
  - make
  - gcc
  - gcc-c++

hermes_playwright_runtime_packages:
  - liberation-fonts
  - dejavu-sans-fonts
  - pulseaudio-libs
  - libxshmfence
  - nspr
  - nss
  - nss-util
  - alsa-lib
  - atk
  - at-spi2-atk
  - at-spi2-core
  - cups-libs
  - mesa-libgbm
  - libdrm
  - libX11
  - libxcb
  - libXcomposite
  - libXdamage
  - libXext
  - libXfixes
  - libxkbcommon
  - libXrandr
  - pango
  - cairo
  - gdk-pixbuf2
  - gtk3

# Safety defaults
hermes_remove_from_wheel: true
hermes_enable_linger: true
...
